<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GPP — Mapa de Percepción Personal</title>
  <style>
    /* ===== ESTILOS GLOBALES ===== */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #0b1020;
      color: #e2e8f0;
      padding: 2rem 1rem;
      line-height: 1.5;
    }
    .container { max-width: 1200px; margin: 0 auto; }

    header { text-align: center; margin-bottom: 2rem; }
    header h1 { font-size: 2rem; letter-spacing: -0.02em; }
    header p { color: #94a3b8; margin-top: 0.3rem; }

    /* ===== BRÚJULA INICIAL ===== */
    #compass {
      background: #111827;
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 1.5rem;
      margin-bottom: 2rem;
      text-align: center;
    }
    #compass h2 { font-size: 1.2rem; margin-bottom: 0.5rem; }
    #compass p { color: #94a3b8; margin-bottom: 1rem; }
    .compass-options {
      display: flex; flex-wrap: wrap; gap: 0.8rem;
      justify-content: center;
    }
    .compass-btn {
      background: #1f2937;
      border: 2px solid transparent;
      border-radius: 40px;
      padding: 0.6rem 1.4rem;
      color: #e2e8f0;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
    }
    .compass-btn:hover { border-color: #475569; transform: scale(1.02); }
    .compass-btn.selected { border-color: #60a5fa; background: #1e293b; }
    .compass-btn[aria-pressed="true"] { border-color: #60a5fa; background: #1e293b; }

    /* ===== CAPAS ===== */
    .layer-card {
      background: #111827;
      border: 1px solid #334155;
      border-radius: 14px;
      margin-bottom: 1.2rem;
      overflow: hidden;
    }
    .layer-header {
      padding: 0.8rem 1.2rem;
      font-weight: 700;
      font-size: 1.05rem;
      display: flex;
      align-items: center;
      gap: 0.6rem;
      border-bottom: 1px solid #334155;
    }
    .layer-header .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
    .layer-body {
      padding: 1rem 1.2rem;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 0.8rem;
    }
    .node-option {
      display: flex; flex-direction: column; gap: 0.5rem;
      background: #1f2937;
      border: 1px solid transparent;
      border-radius: 10px;
      padding: 0.8rem;
      transition: 0.15s;
    }
    .node-option:hover { border-color: #475569; }
    .node-label { font-weight: 600; font-size: 0.95rem; }
    .node-desc { font-size: 0.82rem; color: #94a3b8; margin-top: 0.1rem; }
    .intensity-scale {
      display: flex;
      gap: 0.4rem;
      align-items: center;
      flex-wrap: wrap;
    }
    .intensity-scale label {
      display: flex; align-items: center; gap: 0.2rem;
      font-size: 0.75rem;
      color: #cbd5e1;
      cursor: pointer;
    }
    .intensity-scale input[type="radio"] {
      accent-color: #60a5fa;
      width: 14px; height: 14px;
    }
    .intensity-scale label span { font-size: 0.7rem; }

    /* ===== BOTONES ===== */
    .actions { display: flex; gap: 0.7rem; margin: 1.5rem 0; flex-wrap: wrap; }
    .btn {
      flex: 1; padding: 0.9rem; border: none; border-radius: 60px;
      font-size: 1rem; font-weight: 600; cursor: pointer; transition: 0.2s;
      min-width: 140px;
    }
    .btn-primary { background: #2563eb; color: #fff; }
    .btn-primary:hover { background: #1d4ed8; }
    .btn-ghost { background: transparent; color: #94a3b8; border: 1px solid #334155; }
    .btn-ghost:hover { color: #e2e8f0; border-color: #64748b; }
    .btn-outline {
      background: transparent;
      color: #60a5fa;
      border: 1px solid #60a5fa;
    }
    .btn-outline:hover { background: #1e293b; }

    /* ===== RESULTADOS ===== */
    #results { display: none; margin-top: 2rem; }
    .tabs {
      display: flex; gap: 0.4rem; margin-bottom: 1rem;
      flex-wrap: wrap;
    }
    .tab {
      padding: 0.5rem 1.2rem;
      border-radius: 999px;
      border: 1px solid #334155;
      background: #111827;
      color: #94a3b8;
      cursor: pointer;
      font-size: 0.9rem;
      transition: 0.2s;
    }
    .tab.active, .tab[aria-selected="true"] {
      background: #1e293b;
      color: #e2e8f0;
      border-color: #475569;
    }
    .viz {
      display: none;
      background: #111827;
      border: 1px solid #334155;
      border-radius: 14px;
      padding: 1.2rem;
    }
    .viz.active { display: block; }

    /* ===== NARRATIVA ===== */
    .narrative { line-height: 1.7; font-size: 1.05rem; }
    .narrative h3 {
      margin: 1.2rem 0 0.4rem;
      font-size: 1.1rem;
      color: #cbd5e1;
    }
    .narrative .tag {
      display: inline-block;
      padding: 0.15rem 0.6rem;
      border-radius: 999px;
      font-size: 0.78rem;
      font-weight: 600;
      margin: 0.15rem 0.2rem 0.15rem 0;
    }
    .narrative .pattern {
      background: #1e293b;
      border-left: 4px solid #facc15;
      padding: 0.5rem 0.8rem;
      margin: 0.4rem 0;
      border-radius: 6px;
      color: #cbd5e1;
    }
    .dominance-list {
      list-style: none;
      padding: 0;
    }
    .dominance-list li {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.3rem 0;
      border-bottom: 1px solid #1e293b;
    }
    .dominance-list .node-name { font-weight: 500; }
    .dominance-list .intensity-badge {
      background: #1e293b;
      padding: 0.1rem 0.5rem;
      border-radius: 999px;
      font-size: 0.75rem;
      color: #94a3b8;
    }

    /* ===== RADAR ===== */
    .radar-wrap { width: 100%; overflow: auto; text-align: center; }
    .radar-wrap svg { max-width: 100%; height: auto; }

    /* ===== GRAFO ===== */
    .graph-wrap { width: 100%; overflow: auto; text-align: center; }
    .graph-wrap svg { max-width: 100%; height: auto; }
    .node-circle { transition: 0.3s; cursor: pointer; }
    .node-label-svg { font-size: 10px; fill: #cbd5e1; pointer-events: none; text-anchor: middle; }
    .edge { transition: 0.3s; }

    /* ===== TOOLTIP ===== */
    .tooltip {
      position: absolute;
      background: #0f172a;
      border: 1px solid #475569;
      color: #e2e8f0;
      padding: 0.5rem 0.7rem;
      border-radius: 8px;
      font-size: 0.85rem;
      pointer-events: none;
      opacity: 0;
      transition: 0.15s;
      z-index: 10;
      max-width: 260px;
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 720px) {
      .layer-body { grid-template-columns: 1fr; }
      .compass-options { flex-direction: column; align-items: center; }
      .actions { flex-direction: column; }
    }
  </style>
</head>
<body>
<div class="container">
  <header>
    <h1>🧭 Mapa de Percepción Personal</h1>
    <p>No eres una etiqueta. Eres un conjunto de formas de procesar el mundo.</p>
  </header>

  <!-- ===== BRÚJULA INICIAL ===== -->
  <div id="compass" role="group" aria-labelledby="compass-title">
    <h2 id="compass-title">🌱 ¿Cuál es tu «modo principal»?</h2>
    <p>Elige el que más resuene contigo (puedes cambiarlo luego). Te ayudará a empezar.</p>
    <div class="compass-options">
      <button class="compass-btn" data-mode="visual" aria-pressed="false">🖼️ Visual – veo imágenes y colores</button>
      <button class="compass-btn" data-mode="verbal" aria-pressed="false">🗣️ Verbal – pienso con palabras y sonidos</button>
      <button class="compass-btn" data-mode="kinestesico" aria-pressed="false">🦵 Kinestésico – lo siento en el cuerpo</button>
      <button class="compass-btn" data-mode="abstracto" aria-pressed="false">🧠 Abstracto – conexiones y conceptos</button>
    </div>
  </div>

  <!-- ===== FORMULARIO DE CAPAS ===== -->
  <form id="gpp-form">
    <div id="layers-container"></div>
    <div class="actions">
      <button type="button" class="btn btn-primary" id="btn-generate">Ver mi mapa →</button>
      <button type="button" class="btn btn-ghost" id="btn-reset">↺ Empezar de cero</button>
      <button type="button" class="btn btn-outline" id="btn-export">💾 Exportar perfil</button>
    </div>
  </form>

  <!-- ===== RESULTADOS ===== -->
  <div id="results">
    <div class="tabs" role="tablist" aria-label="Vistas del mapa">
      <button class="tab active" data-viz="text" role="tab" aria-selected="true" aria-controls="viz-text">📖 Narrativa</button>
      <button class="tab" data-viz="radar" role="tab" aria-selected="false" aria-controls="viz-radar">📊 Radar</button>
      <button class="tab" data-viz="graph" role="tab" aria-selected="false" aria-controls="viz-graph">🌀 Grafo de red</button>
    </div>

    <div class="viz active" id="viz-text" role="tabpanel" aria-labelledby="tab-text">
      <div class="narrative" id="narrative-box"></div>
    </div>
    <div class="viz" id="viz-radar" role="tabpanel" aria-labelledby="tab-radar">
      <div class="radar-wrap" id="radar-box"></div>
    </div>
    <div class="viz" id="viz-graph" role="tabpanel" aria-labelledby="tab-graph">
      <div class="graph-wrap" id="graph-box"></div>
    </div>
  </div>
</div>
<div class="tooltip" id="tooltip"></div>

<script>
/* ================================================================
   GPP — Mapa de Percepción Personal
   v3.0 – Arquitectura modular, Store central, Intensidades, Radar, Exportación
   ================================================================ */

// ================================================================
// 1. CONFIGURACIÓN (datos estáticos)
// ================================================================
const LAYERS = [
  {
    id: 'ingesta',

    hex: '#ff6b6b',
    nodes: [

    label: '¿Cómo le das vueltas?',
    color: '#feca57',
    hex: '#feca57',
    nodes: [

      { id: 'rizomatico', label: 'Saltos de conejo', desc: 'Empiezas pensando en qué cenar y acabas planeando un viaje a Japón. Las conexiones fluyen solas.' },

      { id: 'no_verbal', label: 'Corazonadas', desc: 'Tienes una sensación o un «saber» que no viene en palabras, sino en bloque.' },

      { id: 'calculo_adapt', label: 'Camaleón social', desc: 'Ajustas tu comportamiento según quién tengas delante. Como cambiar de canal.' },

      { id: 'mascaramiento_ent', label: 'Personaje según el lugar', desc: 'Tu personalidad cambia drásticamente según estés en el trabajo, en casa o con amigos.' }
    ]
  },
  {
    id: 'sistemica',
    label: '¿Cómo te relacionas con los demás?',
    color: '#a29bfe',
    hex: '#a29bfe',
    nodes: [
      { id: 'deteccion_incons', label: 'Detector de incoherencias', desc: 'Notas al instante cuando alguien dice una cosa y hace otra, o cuando una norma no se cumple.' },
      { id: 'extraccion_perc', label: 'Radar de ambiente', desc: 'Entras a una habitación y notas el «ambiente tenso» sin que te lo digan. Lo sientes en el cuerpo.' },
      { id: 'alineacion_fluida', label: 'Integración natural', desc: 'Te adaptas a las normas del grupo sin esfuerzo, como si hubieras estado siempre ahí.' },
      { id: 'resistencia_est', label: 'Fricción con el sistema', desc: 'Cuando una norma te parece injusta, te cuesta seguirla. Te plantas.' },
      { id: 'empatia_visceral', label: 'Empatía corporal', desc: 'Si el otro está triste, sientes un nudo en el estómago. Lo vives en tus carnes.' },

// Aristas teóricas (conexiones típicas entre nodos)
const EDGES = [
  { from: 'hiper_ingesta', to: 'inundacion_cross', type: 'intra' },
  { from: 'propioceptivo', to: 'descarga_motora', type: 'inter' },
  { from: 'visual_dom', to: 'abstracto', type: 'inter' },
  { from: 'auditivo_dom', to: 'verbal_dom', type: 'inter' },
  { from: 'no_verbal', to: 'experienciacion', type: 'inter' },
  { from: 'flash_asoc', to: 'rizomatico', type: 'intra' },
  { from: 'flash_asoc', to: 'recup_post_cog', type: 'inter' },
  { from: 'meta_continua', to: 'revision_comp', type: 'intra' },
  { from: 'analisis_post', to: 'espontaneidad_ctx', type: 'inter' },
  { from: 'intelectualizacion', to: 'calculo_adapt', type: 'inter' },
  { from: 'exp_directa', to: 'resistencia_est', type: 'inter' },
  { from: 'deteccion_incons', to: 'resistencia_est', type: 'intra' },
  { from: 'empatia_visceral', to: 'experienciacion', type: 'inter' },
  { from: 'lectura_mec', to: 'calculo_adapt', type: 'inter' }
];

// Presets para la brújula (intensidad: 0=nunca, 1=a veces, 2=a menudo, 3=siempre)
const COMPASS_PRESETS = {
  visual: { 'visual_dom': 3, 'abstracto': 2, 'flash_asoc': 2 },
  verbal: { 'auditivo_dom': 3, 'verbal_dom': 2, 'simulacion_soc': 2 },
  kinestesico: { 'propioceptivo': 3, 'descarga_motora': 2, 'experienciacion': 2 },
  abstracto: { 'rizomatico': 3, 'meta_continua': 2, 'anticipacion': 2 }
};

// ================================================================
// 2. MODELO: Profile (inmutable)
// ================================================================
class Profile {
  constructor(intensities = {}) {
    this._intensities = { ...intensities }; // { nodeId: 0-3 }
  }

  // Obtener intensidad de un nodo (0 si no definido)
  getIntensity(nodeId) {
    return this._intensities[nodeId] || 0;
  }

  // Establecer intensidad de un nodo, devuelve nuevo Profile
  setIntensity(nodeId, value) {
    const newIntensities = { ...this._intensities };
    if (value <= 0) {
      delete newIntensities[nodeId];
    } else {
      newIntensities[nodeId] = value;
    }
    return new Profile(newIntensities);
  }

  // Obtener nodos activos con umbral (por defecto >=2, "a menudo" o "siempre")
  getActiveNodes(threshold = 2) {
    return Object.entries(this._intensities)
      .filter(([id, val]) => val >= threshold)
      .map(([id]) => id);
  }

  // Promedio de intensidad por capa
  getAverageIntensityByLayer(layerId) {
    const layer = LAYERS.find(l => l.id === layerId);
    if (!layer) return 0;
    const intensities = layer.nodes.map(n => this.getIntensity(n.id));
    const sum = intensities.reduce((acc, val) => acc + val, 0);
    return sum / intensities.length;
  }

  // Número de nodos con intensidad > 0
  countNonZero(layerId = null) {
    if (layerId) {
      const layer = LAYERS.find(l => l.id === layerId);
      return layer ? layer.nodes.filter(n => this.getIntensity(n.id) > 0).length : 0;
    }
    return Object.values(this._intensities).filter(v => v > 0).length;
  }

  // Índice de diversidad (0-1) basado en entropía de intensidades
  getDiversityIndex(layerId = null) {
    let intensities;
    if (layerId) {
      const layer = LAYERS.find(l => l.id === layerId);
      if (!layer) return 0;
      intensities = layer.nodes.map(n => this.getIntensity(n.id));
    } else {
      intensities = Object.values(this._intensities);
      // Si no hay intensidades, diversidad 0
      if (intensities.length === 0) return 0;
    }

    const total = intensities.reduce((acc, val) => acc + val, 0);
    if (total === 0) return 0;

    // Normalizar a probabilidades
    const probs = intensities.map(v => v / total);
    const entropy = -probs.reduce((acc, p) => acc + (p > 0 ? p * Math.log2(p) : 0), 0);
    const maxEntropy = Math.log2(intensities.length || 1);
    return entropy / maxEntropy;
  }

  // Serialización
  toJSON() {
    return this._intensities;
  }

  static fromJSON(data) {
    return new Profile(data || {});
  }

  // Para debug
  toString() {
    return JSON.stringify(this._intensities);
  }
}

// ================================================================
// 3. STORE (gestión central del estado)
// ================================================================
const STORAGE_KEY = 'gpp_profile_v3';

class Store {
  constructor() {
    this._profile = this._loadProfile();
    this._listeners = new Set();
  }

  _loadProfile() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      return Profile.fromJSON(raw ? JSON.parse(raw) : {});
    } catch {
      return new Profile();
    }
  }

  _saveProfile() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(this._profile.toJSON()));
    } catch {}
  }

  getProfile() {
    return this._profile;
  }

  setProfile(newProfile) {
    this._profile = newProfile;
    this._saveProfile();
    this._notify();
  }

  setIntensity(nodeId, value) {
    const newProfile = this._profile.setIntensity(nodeId, value);
    this.setProfile(newProfile);
  }

  applyPreset(mode) {
    const preset = COMPASS_PRESETS[mode];
    if (!preset) return;
    let newProfile = this._profile;
    Object.entries(preset).forEach(([nodeId, intensity]) => {
      newProfile = newProfile.setIntensity(nodeId, intensity);
    });
    this.setProfile(newProfile);
  }

  reset() {
    this.setProfile(new Profile());
  }

  subscribe(listener) {
    this._listeners.add(listener);
    return () => this._listeners.delete(listener);
  }

  _notify() {
    this._listeners.forEach(listener => {
      try { listener(this._profile); } catch (e) { console.error(e); }
    });
  }
}

// ================================================================
// 4. SERVICIOS DE RENDERIZADO
// ================================================================
const layersContainer = document.getElementById('layers-container');
const narrativeBox = document.getElementById('narrative-box');
const radarBox = document.getElementById('radar-box');
const graphBox = document.getElementById('graph-box');
const tooltip = document.getElementById('tooltip');
const resultsDiv = document.getElementById('results');

// --- 4.1 Renderizar opciones de capas (radios de intensidad) ---
function renderLayerOptions(profile) {
  layersContainer.innerHTML = '';
  LAYERS.forEach(layer => {
    const card = document.createElement('div');
    card.className = 'layer-card';
    card.innerHTML = `
      <div class="layer-header" style="color:${layer.color}">
        <span class="dot" style="background:${layer.color}"></span>
        ${layer.label}
      </div>
      <div class="layer-body" data-layer="${layer.id}"></div>
    `;
    const body = card.querySelector('.layer-body');
    layer.nodes.forEach(node => {
      const currentVal = profile.getIntensity(node.id);
      const nodeDiv = document.createElement('div');
      nodeDiv.className = 'node-option';
      nodeDiv.innerHTML = `
        <div class="node-label">${node.label}</div>
        <div class="node-desc">${node.desc}</div>
        <div class="intensity-scale" role="radiogroup" aria-label="Intensidad para ${node.label}">
          ${[0,1,2,3].map(val => `
            <label>
              <input type="radio" name="intensity-${node.id}" value="${val}" ${currentVal === val ? 'checked' : ''}>
              <span>${['Nunca','A veces','A menudo','Siempre'][val]}</span>
            </label>
          `).join('')}
        </div>
      `;
      body.appendChild(nodeDiv);

      // Event listener para cambios de intensidad
      const radios = nodeDiv.querySelectorAll('input[type="radio"]');
      radios.forEach(radio => {
        radio.addEventListener('change', () => {
          const value = parseInt(radio.value, 10);
          store.setIntensity(node.id, value);
        });
      });
    });
    layersContainer.appendChild(card);
  });
}

// --- 4.2 Narrativa con análisis de dominancia y diversidad ---
function renderNarrative(profile) {
  if (profile.countNonZero() === 0) {
    narrativeBox.innerHTML = `<p style="color:#64748b; font-style:italic;">Marca al menos un nodo para ver tu perfil.</p>`;
    return;
  }

  let html = `<p style="margin-bottom:1rem; color:#94a3b8;">Tu mapa tiene <strong>${profile.countNonZero()}</strong> mecanismos con intensidad mayor a cero.</p>`;

  // Resumen por capas
  LAYERS.forEach(layer => {
    const activeCount = layer.nodes.filter(n => profile.getIntensity(n.id) > 0).length;
    if (activeCount === 0) return;
    const avg = profile.getAverageIntensityByLayer(layer.id).toFixed(1);
    html += `<h3 style="color:${layer.color}">${layer.label} <span style="font-size:0.8rem; color:#94a3b8;">(intensidad media: ${avg}/3)</span></h3><p>`;
    layer.nodes.forEach(n => {
      const val = profile.getIntensity(n.id);
      if (val > 0) {
        html += `<span class="tag" style="background:${layer.color}22; color:${layer.color}; border:1px solid ${layer.color}44;">${n.label} · ${val}/3</span>`;
      }
    });
    html += `</p>`;
  });

  // Mecanismos dominantes (intensidad >= 2)
  const dominantNodes = [];
  LAYERS.forEach(layer => {
    layer.nodes.forEach(n => {
      const val = profile.getIntensity(n.id);
      if (val >= 2) dominantNodes.push({ ...n, layerColor: layer.color, intensity: val });
    });
  });
  dominantNodes.sort((a, b) => b.intensity - a.intensity);

  if (dominantNodes.length > 0) {
    html += `<h3 style="color:#cbd5e1; margin-top:1.2rem;">🌟 Mecanismos dominantes</h3><ul class="dominance-list">`;
    dominantNodes.slice(0, 8).forEach(n => {
      html += `<li>
        <span class="node-name" style="color:${n.layerColor}">${n.label}</span>
        <span class="intensity-badge">${['','A veces','A menudo','Siempre'][n.intensity]}</span>
      </li>`;
    });
    html += `</ul>`;
  }

  // Diversidad global y por capa
  const globalDiv = profile.getDiversityIndex();
  html += `<h3 style="color:#cbd5e1; margin-top:1.2rem;">🧩 Diversidad de tu perfil</h3>`;
  html += `<p>Índice de diversidad global: <strong>${(globalDiv * 100).toFixed(0)}%</strong>.
    ${globalDiv > 0.7 ? 'Tu perfil es muy diverso: usas muchos mecanismos diferentes de forma equilibrada.' :
      globalDiv > 0.4 ? 'Tienes un perfil moderadamente diverso, con algunos mecanismos más destacados.' :
      'Tu perfil es más focalizado: unos pocos mecanismos dominan claramente.'}</p>`;

  // Diversidad por capa
  LAYERS.forEach(layer => {
    const div = profile.getDiversityIndex(layer.id);
    if (div > 0) {
      html += `<p style="font-size:0.9rem; color:#94a3b8;">- ${layer.label}: ${(div * 100).toFixed(0)}% de diversidad.</p>`;
    }
  });

  // Patrones
  const patterns = detectPatterns(profile);
  if (patterns.length) {
    html += `<h3 style="color:#cbd5e1; margin-top:1.2rem;">🔍 Observaciones sobre tu mapa</h3>`;
    patterns.forEach(p => {
      html += `<div class="pattern">${p}</div>`;
    });
  }

  narrativeBox.innerHTML = html;
}

function detectPatterns(profile) {
  const has = (id, threshold = 2) => profile.getIntensity(id) >= threshold;
  const patterns = [];
  if (has('analisis_post') && has('espontaneidad_ctx'))
    patterns.push('Actúas en el momento y reflexionas después. Como un jazzista que improvisa y luego analiza la partitura.');
  if (has('hiper_ingesta') && has('recup_post_cog'))
    patterns.push('Captas mucha información y necesitas tiempo a solas para procesarla. Eres como un radar con su propia siesta.');
  if (has('meta_continua') && has('revision_comp'))
    patterns.push('Tienes un observador interno que no para de comentar y revisar. Como un crítico de cine dentro de tu cabeza.');
  if (has('deteccion_incons') && has('resistencia_est'))
    patterns.push('Detectas incoherencias y te cuesta seguir normas que no encajan. Tienes un sensor de justicia muy fino.');
  if (has('no_verbal') && has('experienciacion') && !has('verbal_dom'))
    patterns.push('Sientes y experimentas antes de ponerlo en palabras. Tu mundo interior es más una sinfonía que un discurso.');
  if (has('flash_asoc') && has('rizomatico') && has('recup_post_cog'))
    patterns.push('Tu mente salta de idea en idea, pero luego necesitas un respiro. Eres un fuego artificial que necesita su pausa.');
  if (has('empatia_visceral') && has('interoceptivo'))
    patterns.push('Sientes las emociones de los demás en tu propio cuerpo. Tu empatía es física, no solo mental.');
  // Nuevos patrones basados en diversidad
  const globalDiv = profile.getDiversityIndex();
  if (globalDiv > 0.75)
    patterns.push('Tienes una flexibilidad cognitiva alta: puedes adaptarte a distintas formas de procesar según la situación.');
  if (globalDiv < 0.35)
    patterns.push('Tienes un estilo de procesamiento muy definido y consistente. Sabes lo que te funciona.');
  return patterns;
}

// --- 4.3 Radar (gráfico de araña con SVG) ---
function renderRadar(profile) {
  const size = 400;
  const cx = size / 2, cy = size / 2;
  const radius = 160;
  const levels = 3; // número de anillos (para intensidad 0-3)
  const angleStep = (2 * Math.PI) / LAYERS.length;
  const startAngle = -Math.PI / 2;

  const ns = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(ns, 'svg');
  svg.setAttribute('viewBox', `0 0 ${size} ${size}`);
  svg.setAttribute('width', size);
  svg.setAttribute('height', size);
  svg.style.maxWidth = '100%';

  // Anillos
  for (let level = 1; level <= levels; level++) {
    const r = (radius / levels) * level;
    const circle = document.createElementNS(ns, 'circle');
    circle.setAttribute('cx', cx); circle.setAttribute('cy', cy); circle.setAttribute('r', r);
    circle.setAttribute('fill', 'none');
    circle.setAttribute('stroke', '#1e2937');
    circle.setAttribute('stroke-width', '1');
    svg.appendChild(circle);
  }

  // Ejes y etiquetas
  const points = {};
  LAYERS.forEach((layer, i) => {
    const angle = startAngle + i * angleStep;
    const x = cx + radius * Math.cos(angle);
    const y = cy + radius * Math.sin(angle);
    points[layer.id] = { x, y, angle };

    // Eje
    const line = document.createElementNS(ns, 'line');
    line.setAttribute('x1', cx); line.setAttribute('y1', cy);
    line.setAttribute('x2', x); line.setAttribute('y2', y);
    line.setAttribute('stroke', '#334155');
    line.setAttribute('stroke-width', '1');
    svg.appendChild(line);

    // Etiqueta de capa
    const labelX = cx + (radius + 30) * Math.cos(angle);
    const labelY = cy + (radius + 30) * Math.sin(angle);
    const text = document.createElementNS(ns, 'text');
    text.setAttribute('x', labelX); text.setAttribute('y', labelY);
    text.setAttribute('text-anchor', 'middle');
    text.setAttribute('dominant-baseline', 'middle');
    text.setAttribute('fill', layer.hex);
    text.setAttribute('font-size', '12');
    text.setAttribute('font-weight', 'bold');
    text.textContent = layer.label.split(' ')[0]; // Solo primera palabra
    svg.appendChild(text);
  });

  // Polígono de datos
  const dataPoints = LAYERS.map(layer => {
    const avg = profile.getAverageIntensityByLayer(layer.id);
    const r = (avg / 3) * radius;
    const angle = startAngle + LAYERS.findIndex(l => l.id === layer.id) * angleStep;
    return {
      x: cx + r * Math.cos(angle),
      y: cy + r * Math.sin(angle),
      avg
    };
  });

  const polygon = document.createElementNS(ns, 'polygon');
  polygon.setAttribute('points', dataPoints.map(p => `${p.x},${p.y}`).join(' '));
  polygon.setAttribute('fill', 'rgba(96,165,250,0.3)');
  polygon.setAttribute('stroke', '#60a5fa');
  polygon.setAttribute('stroke-width', '2');
  svg.appendChild(polygon);

  // Puntos en cada vértice
  dataPoints.forEach((p, i) => {
    const circle = document.createElementNS(ns, 'circle');
    circle.setAttribute('cx', p.x); circle.setAttribute('cy', p.y);
    circle.setAttribute('r', 5);
    circle.setAttribute('fill', LAYERS[i].hex);
    circle.setAttribute('stroke', '#fff');
    circle.setAttribute('stroke-width', '1');
    svg.appendChild(circle);
  });

  radarBox.innerHTML = '';
  radarBox.appendChild(svg);
}

// --- 4.4 Grafo (SVG con anillos concéntricos) ---
function renderGraph(profile) {
  const size = 800;
  const cx = size / 2, cy = size / 2;
  const radii = { ingesta: 100, procesamiento: 190, analisis: 280, accion: 370, sistemica: 460 };

  const positions = {};
  LAYERS.forEach(layer => {
    const r = radii[layer.id];
    const offset = (layer.id === 'procesamiento' || layer.id === 'accion') ? Math.PI / layer.nodes.length : 0;
    layer.nodes.forEach((node, i) => {
      const angle = (i / layer.nodes.length) * 2 * Math.PI + offset - Math.PI / 2;
      positions[node.id] = {
        x: cx + r * Math.cos(angle),
        y: cy + r * Math.sin(angle),
        color: layer.hex,
        label: node.label,
        desc: node.desc
      };
    });
  });

  const ns = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(ns, 'svg');
  svg.setAttribute('viewBox', `0 0 ${size} ${size}`);
  svg.setAttribute('width', size);
  svg.setAttribute('height', size);
  svg.style.maxWidth = '100%';

  // Anillos de fondo
  Object.values(radii).forEach(r => {
    const circle = document.createElementNS(ns, 'circle');
    circle.setAttribute('cx', cx); circle.setAttribute('cy', cy); circle.setAttribute('r', r);
    circle.setAttribute('fill', 'none');
    circle.setAttribute('stroke', '#1e2937');
    circle.setAttribute('stroke-width', '1');
    svg.appendChild(circle);
  });

  // Aristas teóricas
  EDGES.forEach(edge => {
    const a = positions[edge.from], b = positions[edge.to];
    if (!a || !b) return;
    const active = profile.getIntensity(edge.from) >= 2 && profile.getIntensity(edge.to) >= 2;
    const line = document.createElementNS(ns, 'line');
    line.setAttribute('x1', a.x); line.setAttribute('y1', a.y);
    line.setAttribute('x2', b.x); line.setAttribute('y2', b.y);
    line.setAttribute('class', 'edge');
    line.setAttribute('stroke', active ? '#94a3b8' : '#1e2937');
    line.setAttribute('stroke-width', active ? 2 : 1);
    line.setAttribute('opacity', active ? 0.9 : 0.25);
    svg.appendChild(line);
  });

  // Aristas de flujo entre capas adyacentes
  for (let i = 0; i < LAYERS.length - 1; i++) {
    const curr = LAYERS[i], next = LAYERS[i+1];
    curr.nodes.forEach(na => {
      if (profile.getIntensity(na.id) < 2) return;
      next.nodes.forEach(nb => {
        if (profile.getIntensity(nb.id) < 2) return;
        const a = positions[na.id], b = positions[nb.id];
        if (!a || !b) return;
        const line = document.createElementNS(ns, 'line');
        line.setAttribute('x1', a.x); line.setAttribute('y1', a.y);
        line.setAttribute('x2', b.x); line.setAttribute('y2', b.y);
        line.setAttribute('stroke', curr.color);
        line.setAttribute('stroke-width', 1.5);
        line.setAttribute('opacity', 0.3);
        line.setAttribute('stroke-dasharray', '4 4');
        svg.appendChild(line);
      });
    });
  }

  // Nodos
  Object.entries(positions).forEach(([id, pos]) => {
    const intensity = profile.getIntensity(id);
    const active = intensity >= 2;
    const g = document.createElementNS(ns, 'g');
    g.style.cursor = 'pointer';

    const circle = document.createElementNS(ns, 'circle');
    circle.setAttribute('cx', pos.x); circle.setAttribute('cy', pos.y);
    circle.setAttribute('r', 6 + intensity * 1.5);
    circle.setAttribute('fill', intensity > 0 ? pos.color : '#1e2937');
    circle.setAttribute('stroke', intensity > 0 ? '#fff' : '#334155');
    circle.setAttribute('stroke-width', intensity > 0 ? 2 : 1);
    circle.setAttribute('class', 'node-circle');
    if (intensity > 0) circle.style.filter = `drop-shadow(0 0 ${intensity * 3}px ${pos.color})`;

    const text = document.createElementNS(ns, 'text');
    text.setAttribute('x', pos.x); text.setAttribute('y', pos.y + 22);
    text.setAttribute('class', 'node-label-svg');
    text.textContent = pos.label;

    g.appendChild(circle);
    g.appendChild(text);

    // Tooltip
    g.addEventListener('mouseenter', (e) => {
      tooltip.innerHTML = `<strong>${pos.label}</strong> · Intensidad: ${intensity}/3<br><span style="color:#94a3b8; font-size:0.8rem;">${pos.desc}</span>`;
      tooltip.style.opacity = 1;
      tooltip.style.left = (e.pageX + 12) + 'px';
      tooltip.style.top = (e.pageY + 12) + 'px';
    });
    g.addEventListener('mousemove', (e) => {
      tooltip.style.left = (e.pageX + 12) + 'px';
      tooltip.style.top = (e.pageY + 12) + 'px';
    });
    g.addEventListener('mouseleave', () => { tooltip.style.opacity = 0; });

    svg.appendChild(g);
  });

  graphBox.innerHTML = '';
  graphBox.appendChild(svg);
}

// ================================================================
// 5. EXPORTACIÓN
// ================================================================
function exportProfile(profile) {
  const data = JSON.stringify(profile.toJSON(), null, 2);
  const blob = new Blob([data], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'perfil_gpp.json';
  a.click();
  URL.revokeObjectURL(url);
}

function copyProfileLink(profile) {
  const data = JSON.stringify(profile.toJSON());
  const encoded = btoa(encodeURIComponent(data));
  const url = `${window.location.origin}${window.location.pathname}?profile=${encoded}`;
  navigator.clipboard.writeText(url).then(() => {
    alert('Enlace copiado al portapapeles.');
  });
}

// ================================================================
// 6. INICIALIZACIÓN Y SUSCRIPCIONES
// ================================================================

// Crear Store
const store = new Store();

// Render inicial de capas
renderLayerOptions(store.getProfile());

// Suscribir a cambios del store
store.subscribe((profile) => {
  renderNarrative(profile);
  renderRadar(profile);
  renderGraph(profile);
  // Actualizar radios si es necesario (por cambios desde brújula)
  // Para simplificar, re-renderizamos solo las opciones de capas si el cambio no vino de radios.
  // Pero para evitar bucles, lo hacemos solo si no se está renderizando actualmente.
  // Mejor: usamos un flag para evitar re-renderizar capas innecesariamente.
  // En este caso, los radios ya se actualizan directamente en el DOM al cambiar.
  // Si el cambio viene de la brújula, necesitamos actualizar los radios.
  // Para ello, suscribimos un listener que solo actualiza los radios si no fueron ellos el origen.
  // Simplificamos: re-renderizamos capas cada vez que cambia el perfil desde la brújula o reset.
  // Eso lo haremos desde los botones.
});

// Render inicial de visualizaciones (aunque results está oculto)
renderNarrative(store.getProfile());
renderRadar(store.getProfile());
renderGraph(store.getProfile());

// ================================================================
// 7. BRÚJULA
// ================================================================
const compassBtns = document.querySelectorAll('.compass-btn');
compassBtns.forEach(btn => {
  btn.addEventListener('click', () => {
    const mode = btn.dataset.mode;
    store.applyPreset(mode);
    // Re-renderizar capas para reflejar nuevas intensidades
    renderLayerOptions(store.getProfile());
    // Marcar botón seleccionado
    compassBtns.forEach(b => {
      b.classList.remove('selected');
      b.setAttribute('aria-pressed', 'false');
    });
    btn.classList.add('selected');
    btn.setAttribute('aria-pressed', 'true');
  });
});

// ================================================================
// 8. BOTONES DE ACCIÓN
// ================================================================
const btnGenerate = document.getElementById('btn-generate');
btnGenerate.addEventListener('click', () => {
  resultsDiv.style.display = 'block';
  resultsDiv.scrollIntoView({ behavior: 'smooth', block: 'start' });
});

const btnReset = document.getElementById('btn-reset');
btnReset.addEventListener('click', () => {
  store.reset();
  renderLayerOptions(store.getProfile());
  resultsDiv.style.display = 'none';
  window.scrollTo({ top: 0, behavior: 'smooth' });
  compassBtns.forEach(b => {
    b.classList.remove('selected');
    b.setAttribute('aria-pressed', 'false');
  });
});

const btnExport = document.getElementById('btn-export');
btnExport.addEventListener('click', () => {
  exportProfile(store.getProfile());
});

// ================================================================
// 9. TABS
// ================================================================
const tabs = document.querySelectorAll('.tab');
const vizzes = document.querySelectorAll('.viz');
tabs.forEach(tab => {
  tab.addEventListener('click', () => {
    const id = tab.dataset.viz;
    tabs.forEach(t => {
      const isActive = t.dataset.viz === id;
      t.classList.toggle('active', isActive);
      t.setAttribute('aria-selected', isActive);
    });
    vizzes.forEach(v => {
      v.classList.toggle('active', v.id === 'viz-' + id);
    });
  });
});

// ================================================================
// 10. TOOLTIP GLOBAL
// ================================================================
document.addEventListener('mousemove', (e) => {
  if (tooltip.style.opacity === '1') {
    tooltip.style.left = (e.pageX + 12) + 'px';
    tooltip.style.top = (e.pageY + 12) + 'px';
  }
});

console.log('🧭 Mapa de Percepción Personal v3.0 cargado.');
</script>
